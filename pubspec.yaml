name: manofit
description: "ManoFit - AI-Powered Personnel Stress & Welfare Monitoring System for Armed Forces and CAPFs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.8.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/landing_page_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/login_service_id/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/sign_in_otp_verification/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/onboarding_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/home_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/mood_check_in_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/wellbeing_check_in_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/self_help_hub_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/ai_companion_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/book_session_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/profile_light/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/hr_admin_web_console_overview/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/hr_admin_web_console_data_ingestion/screen.png
    - stitch_manofit_design_system (1)/stitch_manofit_design_system/hr_admin_mobile_ingestion_review/screen.png

