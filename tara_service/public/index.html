<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tara</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: radial-gradient(circle at 50% 28%, #123b34 0%, #02150f 72%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e6f2ee;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.14em;
    margin: 0;
    color: #bfe6d9;
  }
  .tagline {
    margin: -14px 0 0;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
    color: #6f8f84;
  }
  #status {
    min-height: 1.4em;
    font-size: 0.95rem;
    color: #8aa79c;
    text-align: center;
    max-width: 320px;
    padding: 0 16px;
  }
  .lang-toggle {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(158, 209, 195, 0.08);
    border: 1px solid rgba(158, 209, 195, 0.18);
  }
  .lang-toggle button {
    appearance: none;
    border: none;
    cursor: pointer;
    background: transparent;
    color: #7fa093;
    font: inherit;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
    padding: 6px 16px;
    border-radius: 999px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .lang-toggle button.on {
    background: linear-gradient(160deg, #9ED1C3, #37675B);
    color: #02241f;
    font-weight: 600;
  }
  .call-wrap {
    position: relative;
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(158, 209, 195, 0.4);
    opacity: 0;
  }
  .call-wrap.active .ring { animation: pulse 1.8s ease-out infinite; }
  .call-wrap.active .ring:nth-child(2) { animation-delay: 0.6s; }
  .call-wrap.active .ring:nth-child(3) { animation-delay: 1.2s; }
  @keyframes pulse {
    0% { transform: scale(0.7); opacity: 0.55; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  #callBtn {
    position: relative;
    z-index: 1;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(160deg, #9ED1C3, #37675B);
    box-shadow: 0 10px 28px rgba(55, 103, 91, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, transform 0.15s ease;
  }
  #callBtn:active { transform: scale(0.96); }
  .call-wrap.active #callBtn {
    background: linear-gradient(160deg, #e88c7d, #a83a3a);
    box-shadow: 0 10px 28px rgba(168, 58, 58, 0.5);
  }
  #callBtn svg { width: 34px; height: 34px; fill: #02241f; }
  .call-wrap.active #callBtn svg { fill: #fff; }
</style>
</head>
<body>
  <h1>TARA</h1>
  <p class="tagline">your calm voice companion</p>
  <div class="lang-toggle" id="langToggle" role="group" aria-label="Conversation language">
    <button type="button" data-lang="auto">Auto</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="hi" lang="hi">हिं</button>
  </div>
  <div class="call-wrap" id="callWrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <button id="callBtn" aria-label="Start talking to Tara">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1L6.6 10.8z"/></svg>
    </button>
  </div>
  <p id="status">Tap to talk to Tara</p>
  <script src="app.js"></script>
</body>
</html>
